name: Verify k.3m.0 tactical memory stability

on:
  push:
    branches:
      - feature/k3m0-tactical-awareness

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3m0-tactical-awareness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply stability patch
        run: python3 tools/k3m0_stability.py
      - name: Syntax check
        run: node --check tacticalAwareness.js
      - name: Run test suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary verification machinery
        run: rm -f tools/k3m0_stability.py .github/workflows/k3m0-stability.yml
      - name: Commit verified stability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "k.3m.0: stabilize tactical pressure memory"
          git push origin HEAD:feature/k3m0-tactical-awareness
