name: Verify k.3j.0 emergency recovery

on:
  push:
    branches: ["feature/k3j0-emergency-recovery"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3j0-emergency-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check recovery modules
        run: |
          node --check fieldService.js
          node --check hostileRig.js
          node --check main.js
      - name: Run unit tests
        run: npm test
