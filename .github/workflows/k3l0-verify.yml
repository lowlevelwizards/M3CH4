name: Verify final k.3l.0 bout stakes
on:
  push:
    branches:
      - feature/k3l0-bout-stakes-salvage
    paths:
      - '.github/workflows/k3l0-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3l0-bout-stakes-salvage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check touched JavaScript
        run: |
          node --check combat.js
          node --check functionalDamage.js
          node --check garage.js
          node --check economy.js
          node --check acquisition.js
          node --check persistence.js
          node --check progression.js
          node --check damageVisuals.js
          node --check boutScoring.js
          node --check damageFate.js
          node --check salvageDraft.js
          node --check boutSession.js
          node --check acquisitionUI.js
          node --check garageMountUI.js
          node --check sceneAssembly.js
          node --check scene.js
          node --check main.js
      - name: Run full test suite
        run: npm test
