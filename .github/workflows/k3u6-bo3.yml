name: k3u6 Matched Tactical BO3 Study
on:
  push:
    branches: ["k3u6-objective-discipline"]
    paths: [".github/workflows/k3u6-bo3.yml"]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and baseline integrity
        run: |
          node --check research/k3u6MatchedBo3.mjs
          for f in research/baselineK3u3/*.js; do node --check "$f"; done
      - name: Seed-matched three-versus-three best-of-three simulation
        run: node research/k3u6MatchedBo3.mjs ${{ matrix.shard }} 55 18 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3u6-comparison-${{ matrix.shard }}
          path: study-results/k3u6-*
          if-no-files-found: warn
