name: Verify k.3f.0 contract board

on:
  push:
    branches: ["feature/k3f0-contract-board"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check changed runtime modules
        run: node --check contracts.js && node --check contractUI.js && node --check combat.js && node --check economy.js && node --check acquisition.js && node --check garageMountUI.js
      - name: Run unit tests
        run: npm test
