name: Apply k.3m.0 tactical awareness

on:
  push:
    branches:
      - feature/k3m0-tactical-awareness

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3m0-tactical-awareness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped patch
        run: python3 tools/k3m0_apply.py
      - name: Syntax check touched JavaScript
        run: |
          node --check tacticalAwareness.js
          node --check enemyMotion.js
          node --check main.js
      - name: Run test suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary patch machinery
        run: rm -f tools/k3m0_apply.py .github/workflows/k3m0-apply.yml
      - name: Commit verified product state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "k.3m.0: tactical awareness foundation"
          git push origin HEAD:feature/k3m0-tactical-awareness
