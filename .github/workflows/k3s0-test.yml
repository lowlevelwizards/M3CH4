name: k.3s.0 temporary validation
on:
  push:
    branches: ["k3s0-unified-garage-flow"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Syntax check
        run: node --check main.js && node --check garageBay.js && node --check unifiedGarageUI.js && node --check stableUI.js && node --check fieldWork.js
      - name: Whitespace
        run: git diff --check 13db2aa4063213394a1623ec39c148186d15ca10..HEAD
