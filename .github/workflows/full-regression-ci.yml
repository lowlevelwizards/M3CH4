name: M3CH4 Full Regression (weekly / manual)
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full historical test suite
        run: npm test
      - name: Combat balance smoke
        run: node research/headlessDominationStudy.mjs 4
