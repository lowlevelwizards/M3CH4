name: k.3r.0 temporary validation
on:
  push:
    branches: ["k3r0-field-work-emergency-patch"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full test suite
        run: npm test
      - name: Changed JavaScript syntax
        run: node --check fieldWork.js && node --check fieldWorkUI.js && node --check boutSession.js && node --check garageMountUI.js
      - name: Whitespace check
        run: git diff --check a09ce7c1062b9ea2277fecc9b5d414529ff71632..HEAD
