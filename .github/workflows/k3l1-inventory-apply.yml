name: Apply k.3l.1 physical inventory
on:
  push:
    branches:
      - feature/k3l1-physical-inventory-damage-lighting
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3l1-physical-inventory-damage-lighting
          fetch-depth: 0
      - name: Apply inventory integration
        run: |
          if grep -q "MACHINE_SAVE_VERSION = 8" persistence.js; then
            echo "k.3l.1 inventory integration already applied"
            exit 0
          fi
          python .github/k3l1_inventory_apply.py
      - name: Syntax check touched modules
        run: |
          node --check acquisition.js
          node --check components.js
          node --check persistence.js
          node --check salvageDraft.js
          node --check main.js
          node --check scene.js
          node --check partEconomy.js
          node --check partGridUI.js
      - name: Full test suite
        run: npm test
      - name: Commit applied product changes
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acquisition.js components.js persistence.js salvageDraft.js main.js scene.js sceneAssembly.js
          git commit -m "Implement serial-based physical inventory foundation"
          git push origin HEAD:feature/k3l1-physical-inventory-damage-lighting
