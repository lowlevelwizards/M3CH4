name: Apply k.3l.1 physical inventory
on:
  push:
    branches:
      - feature/k3l1-physical-inventory-damage-lighting
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3l1-physical-inventory-damage-lighting
          fetch-depth: 0
      - name: Apply integrated product changes
        run: |
          if ! grep -q "MACHINE_SAVE_VERSION = 8" persistence.js; then
            python .github/k3l1_inventory_apply.py
          else
            echo "serial inventory already applied"
          fi
          python .github/k3l1_progression_patch.py
          if ! grep -q "fallingParts = new Map" scene.js; then
            python .github/k3l1_visual_apply.py
          else
            echo "damage and lighting integration already applied"
          fi
          if ! grep -q 'main.js?v=k3l1' index.html; then
            python .github/k3l1_polish_patch.py
          else
            echo "effects/cache polish already applied"
          fi
      - name: Syntax check touched modules
        run: |
          node --check acquisition.js
          node --check acquisitionUI.js
          node --check components.js
          node --check persistence.js
          node --check progression.js
          node --check salvageDraft.js
          node --check main.js
          node --check scene.js
          node --check sceneAssembly.js
          node --check damageVisuals.js
          node --check garageMountUI.js
          node --check partEconomy.js
          node --check partGridUI.js
      - name: Full test suite
        run: npm test
      - name: Commit applied product changes
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acquisition.js acquisitionUI.js components.js persistence.js progression.js salvageDraft.js main.js scene.js sceneAssembly.js damageVisuals.js garageMountUI.js index.html
          git commit -m "Finalize physical salvage damage and lighting pass"
          git push origin HEAD:feature/k3l1-physical-inventory-damage-lighting
