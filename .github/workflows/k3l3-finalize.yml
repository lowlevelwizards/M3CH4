name: Finalize k.3l.3

on:
  push:
    branches:
      - feature/k3l3-readability-garage

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3l3-readability-garage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final fixes
        run: python3 tools/k3l3_finalize.py
      - name: Syntax check touched JavaScript
        run: |
          node --check scene.js
          node --check main.js
          node --check acquisitionUI.js
      - name: Run test suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary finalizer
        run: rm -f tools/k3l3_finalize.py .github/workflows/k3l3-finalize.yml
      - name: Commit verified final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "k.3l.3: finalize HUD composite and recovery flow"
          git push origin HEAD:feature/k3l3-readability-garage
