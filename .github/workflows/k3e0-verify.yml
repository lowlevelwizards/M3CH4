name: Verify k.3e.0 acquisition

on:
  push:
    branches: ["feature/k3e0-parts-acquisition"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check changed runtime modules
        run: node --check acquisition.js && node --check acquisitionUI.js && node --check persistence.js && node --check garageMountUI.js
      - name: Run unit tests
        run: npm test
