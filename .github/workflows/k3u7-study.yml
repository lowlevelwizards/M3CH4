name: k3u7 192-Scenario Domination Reliability
on:
  push:
    branches: ["k3u7-combat-awareness-survival"]
    paths: [".github/workflows/k3u7-study.yml"]
  workflow_dispatch:
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deterministic 60 Hz physical 3v3 scenarios
        run: node research/headlessDominationStudy.mjs 4 $(( ${{ matrix.shard }} * 37 ))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3u7-domination-${{ matrix.shard }}
          path: study-results/
          if-no-files-found: warn
