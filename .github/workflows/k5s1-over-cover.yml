name: AI Over-Cover Engagement
on:
  pull_request:
    paths:
      - 'main.js'
      - 'tacticalAwareness.js'
      - 'ai/worldModel.js'
      - 'ai/firingLane.js'
      - 'tests/aiOverCoverEngagement.test.mjs'
      - '.github/workflows/k5s1-over-cover.yml'
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'tacticalAwareness.js'
      - 'ai/worldModel.js'
      - 'ai/firingLane.js'
      - 'tests/aiOverCoverEngagement.test.mjs'
      - '.github/workflows/k5s1-over-cover.yml'
jobs:
  over-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check main.js
          node --check tacticalAwareness.js
          node --check ai/worldModel.js
          node --check ai/firingLane.js
      - name: AI and cover regressions
        run: node --test tests/aiOverCoverEngagement.test.mjs tests/k3u7CombatCompetency.test.mjs tests/k3u1TacticalAI.test.mjs tests/coverTruth.test.mjs
