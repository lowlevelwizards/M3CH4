name: Kestrel Silhouette Playground
on:
  pull_request:
    paths:
      - 'kestrel-silhouette.html'
      - 'research/kestrelSilhouette*.js'
      - 'research/kestrelArmorSpec.js'
      - 'research/kestrelArmorGeometryV4.js'
      - 'research/kestrelV3ArmorBrowserSmoke.mjs'
      - 'research/kestrelSilhouette*.mjs'
      - 'tests/kestrelSilhouetteLab.test.mjs'
      - '.github/workflows/kestrel-silhouette-ci.yml'
      - 'index.html'
      - 'styles.css'
      - 'main.js'
      - 'research/devWorkspacesBrowserSmoke.mjs'
      - 'kestrel-silhouette-v2.css'
  workflow_dispatch:
jobs:
  kestrel-studies:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate design invariants and isolated Naked presets
        run: node --test tests/kestrelSilhouetteLab.test.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve static browser assets
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kestrel-http.log 2>&1 &
          sleep 2
      - name: Verify real assembled rigs, silhouette geometry and phone controls
        run: node research/kestrelSilhouetteBrowserSmoke.mjs
      - name: Verify articulated three-by-three Kestrel stance and gait previews
        run: node research/kestrelV2BrowserSmoke.mjs
      - name: Verify all four Kestrel armor levels, shell variations and articulated geometry
        run: node research/kestrelV3ArmorBrowserSmoke.mjs
      - name: Verify Dev tab launchers are reachable on iPhone and desktop
        run: node research/devWorkspacesBrowserSmoke.mjs
      - name: Upload rendered art review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kestrel-three-candidates-review
          path: |
            kestrel-silhouette-artifacts/
            kestrel-v2-artifacts/
            kestrel-v3-artifacts/
          if-no-files-found: warn
