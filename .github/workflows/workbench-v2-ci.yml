name: M3CH4 Workbench V2 Validation
on:
  pull_request:
    paths:
      - 'workbench/**'
      - 'partWorkbenchV2.js'
      - 'partWorkbenchV2.css'
      - 'part-workbench-v2.html'
      - 'tests/workbenchV2.test.mjs'
      - 'tests/workbenchV3.test.mjs'
      - 'tests/workbenchV31.test.mjs'
      - 'tests/workbenchOrbitCamera.test.mjs'
      - 'research/workbenchV2BrowserSmoke.mjs'
      - 'research/workbenchV3BrowserSmoke.mjs'
      - 'research/workbenchV31BrowserSmoke.mjs'
      - 'research/workbenchCameraBrowserSmoke.mjs'
      - 'research/workbenchVisualFirstBrowserSmoke.mjs'
      - 'research/workbenchContextTouchBrowserSmoke.mjs'
      - 'workbench/thumbnail.js'
      - 'index.html'
      - 'test-yard.html'
      - '.github/workflows/workbench-v2-ci.yml'
  workflow_dispatch:
concurrency:
  group: workbench-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  blueprint-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pure blueprint and existing visual tests
        run: |
          node --check partWorkbenchV2.js
          node --check workbench/thumbnail.js
          node --check workbench/orbitCamera.js
          node --check workbench/editTransactions.js
          node --check workbench/loftTransforms.js
          node --check workbench/meshTopology.js
          node --check workbench/elementSelection.js
          node --check workbench/mirrorGeometry.js
          node --check workbench/hierarchyTransforms.js
          node --check workbench/selectionGeometry.js
          node --check workbench/vertexTransforms.js
          node --check workbench/assetImport.js
          node --check workbench/blueprint.js
          node --check workbench/geometry.js
          node --check workbench/storage.js
          node --test tests/workbenchV2.test.mjs tests/workbenchV3.test.mjs tests/workbenchV31.test.mjs tests/workbenchOrbitCamera.test.mjs tests/partWorkbenchRecipe.test.mjs tests/partVisuals.test.mjs
      - name: Install real browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve live repository
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/m3ch4-workbench-v2.log 2>&1 &
          sleep 2
      - name: Test phone viewport and editable geometry
        run: node research/workbenchV2BrowserSmoke.mjs
      - name: Verify live garage and Test Yard links, machine-facing camera and touch orbit
        run: node research/workbenchCameraBrowserSmoke.mjs
      - name: Verify mobile visual-first interface and actual 3D editing
        run: node research/workbenchVisualFirstBrowserSmoke.mjs
      - name: Verify contextual point sliders, focus modes and device fit
        run: node research/workbenchContextTouchBrowserSmoke.mjs
      - name: Verify Workbench 3 box selection, wireframe and chat asset import
        run: node research/workbenchV3BrowserSmoke.mjs
      - name: Verify Workbench 3.1–3.3 controls in actual phone browser
        run: node research/workbenchV31BrowserSmoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3ch4-workbench-v2-renders
          path: |
            part-workbench-v2-artifacts/
            workbench-camera-artifacts/
            workbench-visual-artifacts/
            workbench-context-artifacts/
          if-no-files-found: warn
