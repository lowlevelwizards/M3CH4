name: M3CH4 Browser Startup Smoke
on:
  pull_request:
    paths: ['main.js', 'index.html', 'scene.js', 'sceneAssembly.js', 'tests/**', 'research/browserStartupSmoke.mjs', '.github/workflows/browser-startup-ci.yml']
  workflow_dispatch:
jobs:
  browser-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve the actual static production entry
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/m3ch4-http.log 2>&1 &
          sleep 2
      - name: Assert main scene renders its first frame
        run: node research/browserStartupSmoke.mjs
      - name: Save screenshot and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-startup
          path: browser-smoke-artifacts/
          if-no-files-found: warn
