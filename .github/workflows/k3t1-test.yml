name: k.3t.1 temporary validation
on:
  push:
    branches: ["k3t1-three-point-domination"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete regression suite
        run: npm test
      - name: Syntax checks
        run: node --check sortieObjectives.js && node --check main.js && node --check scene.js && node --check enemyMotion.js && node --check contracts.js && node --check campaign.js && node --check tests/k3t1Domination.test.mjs
      - name: Whitespace
        run: git diff --check e858d5604fc100c712abcff02f2461d87312e5af..HEAD
