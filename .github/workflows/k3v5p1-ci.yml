name: k3v5p1 Garage and Bout Regression CI
on:
  push:
    branches: ["k3v5p1-garage-and-bout-clarity"]
  pull_request:
    paths:
      - "unifiedGarageUI.js"
      - "unifiedGarageStyles.css"
      - "garageMountUI.js"
      - "sortieAssignmentUI.js"
      - ".github/workflows/k3v5p1-ci.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and all regression tests
        run: |
          for f in main.js unifiedGarageUI.js garageMountUI.js sortieAssignmentUI.js tests/k3v5p1GarageBoutRegressions.test.mjs; do node --check "$f"; done
          node --test tests/k3v5p1GarageBoutRegressions.test.mjs tests/k3q1SortieAssignment.test.mjs tests/k3q2Series.test.mjs tests/k3s1GarageUX.test.mjs
