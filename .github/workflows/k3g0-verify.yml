name: Verify k.3g.0 opponent character pass

on:
  push:
    branches: ["feature/k3g0-opponent-character"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check opponent behavior modules
        run: node --check contracts.js && node --check enemyMotion.js && node --check hostileRig.js && node --check tests/opponentBehavior.test.mjs
      - name: Run unit tests
        run: npm test
