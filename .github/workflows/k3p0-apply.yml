name: Apply and verify k.3p.0
on:
  push:
    branches: [feature/k3p0-recoverable-weapon-disable]
    paths:
      - tools/k3p0_apply.py
      - .github/workflows/k3p0-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3p0-recoverable-weapon-disable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped product patch
        run: python3 tools/k3p0_apply.py
      - name: Refresh legacy presentation invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/k3oCombatPresentation.test.mjs')
          text = path.read_text()
          old = "test('objective status is visible as its own compact HUD readout', () => { assert.match(index, /id=\"objective-status\"/); assert.match(index, /0\\.0\\.1k\\.3o\\.1/); });"
          new = "test('objective status is visible as its own compact HUD readout', () => { assert.match(index, /id=\"objective-status\"/); assert.match(index, /aria-live=\"polite\">OBJ/); });"
          if old not in text:
              raise SystemExit('legacy k3o presentation assertion anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Syntax check changed JavaScript
        run: |
          node --check main.js
          node --check scene.js
          node --check sceneAssembly.js
          node --check aiFieldService.js
      - name: Run complete test suite
        run: npm test
      - name: Validate patch hygiene
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          git diff --check
      - name: Remove temporary patch machinery
        run: rm -f tools/k3p0_apply.py .github/workflows/k3p0-apply.yml
      - name: Commit verified product state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'k.3p.0: recoverable AI weapon disable'
          git push origin HEAD:feature/k3p0-recoverable-weapon-disable
