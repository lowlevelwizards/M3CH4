name: k3w0 Unified Workshop Interface CI
on:
  push:
    branches: ["k3w0-unified-ui-redesign"]
  pull_request:
    paths:
      - "uiLanguage.js"
      - "uiMeters.js"
      - "uiRedesign.css"
      - "unifiedGarageUI.js"
      - "unifiedGarageStyles.css"
      - "garageBay.js"
      - "garageMountUI.js"
      - "partGridUI.js"
      - "cockpitDisplays.js"
      - "cockpitIdentityScene.js"
      - "seriesUI.js"
      - "sortieAssignmentUI.js"
      - ".github/workflows/k3w0-ci.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source syntax and full regression suite
        run: |
          for f in uiLanguage.js uiMeters.js unifiedGarageUI.js garageBay.js garageMountUI.js partGridUI.js cockpitDisplays.js cockpitIdentityScene.js main.js seriesUI.js sortieAssignmentUI.js tests/k3w0UnifiedUI.test.mjs; do node --check "$f"; done
          node --test tests/k3w0UnifiedUI.test.mjs tests/k4s1WorkspaceShell.test.mjs tests/k4s2GarageFlow.test.mjs tests/k4s3DeployLayout.test.mjs
