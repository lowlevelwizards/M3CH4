name: Apply k.3l.4 safe HUD + garage polish

on:
  push:
    branches:
      - feature/k3l4-safe-hud-garage-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3l4-safe-hud-garage-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped patch
        run: python3 tools/k3l4_apply.py
      - name: Correct regression expectations
        run: python3 tools/k3l4_fix_tests.py
      - name: Syntax check touched JavaScript
        run: |
          node --check cockpitView.js
          node --check scene.js
          node --check acquisitionUI.js
          node --check sceneAssembly.js
          node --check garageMountUI.js
      - name: Run test suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary patch machinery
        run: rm -f tools/k3l4_apply.py tools/k3l4_fix_tests.py .github/workflows/k3l4-apply.yml
      - name: Commit verified product state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "k.3l.4: safe HUD and garage presentation polish"
          git push origin HEAD:feature/k3l4-safe-hud-garage-polish
