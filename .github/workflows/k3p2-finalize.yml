name: Finalize and verify k.3p.2

on:
  push:
    branches:
      - feature/k3p2-recovery-readability
    paths:
      - '.github/workflows/k3p2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3p2-recovery-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hit interruption refinement
        run: python3 tools/k3p2_finalize.py
      - name: Syntax check touched JavaScript
        run: |
          node --check main.js
          node --check scene.js
          node --check sceneAssembly.js
      - name: Run complete test suite
        run: npm test
      - name: Validate final branch diff
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          git diff --check
      - name: Remove temporary finalizer
        run: rm -f tools/k3p2_finalize.py .github/workflows/k3p2-finalize.yml
      - name: Commit final verified product state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'k.3p.2: make hit interruptions explicit during service'
          git push origin HEAD:feature/k3p2-recovery-readability
