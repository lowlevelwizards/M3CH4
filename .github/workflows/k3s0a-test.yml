name: k.3s.0a temporary validation
on:
  push:
    branches: ["k3s1-restore-part-previews"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full test suite
        run: npm test
      - name: Touched JavaScript syntax
        run: node --check unifiedGarageUI.js && node --check tests/k3s0aPartGallery.test.mjs
      - name: Whitespace
        run: git diff --check 5d2e94427caac5abc843ae9d3096f43dd3e0d1ac..HEAD
