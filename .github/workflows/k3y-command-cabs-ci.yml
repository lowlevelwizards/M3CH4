name: k3y Command Cab Anatomy CI
on:
  pull_request:
    paths:
      - 'commandVisualKit.js'
      - 'cyclopsVisual.js'
      - 'vistaVisual.js'
      - 'hearthVisual.js'
      - 'commandAnatomyLab.js'
      - 'cab-anatomy.html'
      - 'partVisuals.js'
      - 'chassisFitFixtures.js'
      - 'tests/k3yCommandCabAnatomy.test.mjs'
      - 'research/commandCabBrowserAudit.mjs'
      - '.github/workflows/k3y-command-cabs-ci.yml'
  workflow_dispatch:
jobs:
  browser-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax and complete regression suite
        run: |
          for f in commandVisualKit.js cyclopsVisual.js vistaVisual.js hearthVisual.js commandAnatomyLab.js research/commandCabBrowserAudit.mjs; do node --check "$f"; done
          node --test tests/k3yCommandCabAnatomy.test.mjs tests/cockpitView.test.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve actual browser modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/m3ch4-command-http.log 2>&1 &
          sleep 2
      - name: Inspect geometry and capture real Three.js comparisons
        run: node research/commandCabBrowserAudit.mjs
      - name: Upload actual 3D comparison renders and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3y-command-cab-renders
          path: command-cab-artifacts/
          if-no-files-found: warn
