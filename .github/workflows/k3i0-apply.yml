name: Apply k.3i.0 beginner arena integration

on:
  push:
    branches: ["feature/k3i0-beginner-arena"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3i0-beginner-arena
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped arena patch
        run: python .github/k3i0_apply.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git add main.js persistence.js scene.js sceneAssembly.js index.html
          git commit -m "k.3i.0 integrate beginner arena pacing and dev save wipe"
          git push origin HEAD:feature/k3i0-beginner-arena
