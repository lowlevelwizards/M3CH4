name: Apply k.3i.0 beginner arena integration

on:
  push:
    branches: ["feature/k3i0-beginner-arena"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3i0-beginner-arena
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped arena patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          if '0.0.1k.3i.0' in index.read_text():
              print('k.3i.0 already applied')
              raise SystemExit(0)

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # main.js: authoritative opposing spawn, real LOS before hostile fire, guarded save wipe.
          replace('main.js',
              "import { createRigState, DEFAULT_WORLD, physicsYawToViewYaw, stepRig, } from './locomotion.js';",
              "import { createRigState, DEFAULT_WORLD, HOSTILE_SPAWN, PLAYER_SPAWN, physicsYawToViewYaw, stepRig, } from './locomotion.js';")
          replace('main.js',
              "import { loadMachine, storeMachine } from './persistence.js';",
              "import { clearMachineSave, loadMachine, storeMachine } from './persistence.js';")
          replace('main.js',
              "let hostileRig = createRigState();\nhostileRig.z = 0;\nhostileRig.yaw = Math.PI; // Face the player who deploys at z=8.",
              "let hostileRig = createRigState(HOSTILE_SPAWN);")
          replace('main.js',
              "const hostileObstacle = { id: 'hostile-rig', minX: -1, maxX: 1, minZ: -.9, maxZ: .9 };\nconst pilotObstacle = { id: 'pilot-rig', minX: -1, maxX: 1, minZ: 7.1, maxZ: 8.9 };",
              "const movingObstacleAt = (id, spawn, radius = 1) => ({\n    id, minX: spawn.x - radius, maxX: spawn.x + radius,\n    minZ: spawn.z - radius, maxZ: spawn.z + radius,\n});\nconst hostileObstacle = movingObstacleAt('hostile-rig', HOSTILE_SPAWN);\nconst pilotObstacle = movingObstacleAt('pilot-rig', PLAYER_SPAWN);")
          replace('main.js',
              "const resetRig = required('#reset-rig');",
              "const resetRig = required('#reset-rig');\nconst wipeSave = required('#wipe-save');")
          replace('main.js',
              "let saveErrorShown = false;\nfunction persistMachine() {\n    const saved = storeMachine(saveStorage, { assembly, damage, playerCondition, economy });",
              "let saveErrorShown = false;\nlet persistenceSuppressed = false;\nfunction persistMachine() {\n    if (persistenceSuppressed) return;\n    const saved = storeMachine(saveStorage, { assembly, damage, playerCondition, economy });")
          replace('main.js',
              "        rig = createRigState();\n        hostileRig = createRigState();\n        hostileRig.z = 0;\n        hostileRig.yaw = Math.PI;",
              "        rig = createRigState();\n        hostileRig = createRigState(HOSTILE_SPAWN);")
          replace('main.js',
              "devToggle.addEventListener('click', () => devPanel.classList.toggle('hidden'));\nresetRig.addEventListener('click', () => { rig = createRigState(); controls.recenterLook(); });\ntoggleColliders.addEventListener('click', () => {",
              "devToggle.addEventListener('click', () => devPanel.classList.toggle('hidden'));\nresetRig.addEventListener('click', () => { rig = createRigState(); controls.recenterLook(); });\nlet wipeArmed = false;\nlet wipeTimer = null;\nwipeSave.addEventListener('click', () => {\n    if (!wipeArmed) {\n        wipeArmed = true;\n        wipeSave.textContent = 'CONFIRM WIPE · NEW SAVE';\n        wipeSave.setAttribute('aria-pressed', 'true');\n        if (wipeTimer !== null) window.clearTimeout(wipeTimer);\n        wipeTimer = window.setTimeout(() => {\n            wipeArmed = false;\n            wipeTimer = null;\n            wipeSave.textContent = 'WIPE SAVE / START FRESH';\n            wipeSave.setAttribute('aria-pressed', 'false');\n        }, 4200);\n        return;\n    }\n    persistenceSuppressed = true;\n    if (!clearMachineSave(saveStorage)) {\n        persistenceSuppressed = false;\n        showStatus('SAVE WIPE FAILED · LOCAL STORAGE UNAVAILABLE');\n        return;\n    }\n    try {\n        window.sessionStorage.removeItem('m3ch4-contract-v1');\n        window.sessionStorage.removeItem('m3ch4-recovered-part');\n        window.sessionStorage.removeItem('m3ch4-contract-changed');\n    } catch { /* machine save is already cleared */ }\n    window.location.reload();\n});\ntoggleColliders.addEventListener('click', () => {")
          replace('main.js',
              "    const consumed = fireWeapon(hostileWeaponState, hostileWeaponSpec);\n    if (consumed === null)\n        return;\n    // The test controller is intentionally slower than the weapon's raw cyclic rate.\n    hostileWeaponState.cooldown = Math.max(hostileWeaponState.cooldown, hostile.triggerSeconds * .55);\n    const [spreadX, spreadY] = hostileSpread(shotIndex, hostile.spreadRadians);\n    const aimSlot = hostileAimSlot(shotIndex);\n    const contact = arena.traceHostileShot(rig, aimSlot, spreadX, spreadY);\n    soundFire();\n    if (contact.slot === null) {\n        arena.showHostileShot(contact, null);\n        return;\n    }",
              "    const [spreadX, spreadY] = hostileSpread(shotIndex, hostile.spreadRadians);\n    const aimSlot = hostileAimSlot(shotIndex);\n    const contact = arena.traceHostileShot(rig, aimSlot, spreadX, spreadY);\n    // Cover creates a real contact phase: the hostile does not spend ammunition or\n    // announce its position by firing blindly into an occluding arena structure.\n    if (contact.slot === null)\n        return;\n    const consumed = fireWeapon(hostileWeaponState, hostileWeaponSpec);\n    if (consumed === null)\n        return;\n    // The controller remains slower than the weapon's raw cyclic rate.\n    hostileWeaponState.cooldown = Math.max(hostileWeaponState.cooldown, hostile.triggerSeconds * .55);\n    soundFire();")
          replace('main.js',
              "    hostileRig = createRigState();\n    hostileRig.z = 0;\n    hostileRig.yaw = Math.PI;",
              "    hostileRig = createRigState(HOSTILE_SPAWN);")

          # persistence.js: one authority for deleting every machine-save generation.
          p = Path('persistence.js')
          text = p.read_text()
          if 'export function clearMachineSave' not in text:
              text += """\n\n/** DEV utility: delete every machine-save generation so reload follows the exact\n * same path as a first-time player. Session-only contract selection is cleared by\n * the caller because it belongs to contracts.js rather than machine persistence. */\nexport function clearMachineSave(storage) {\n    if (!storage) return false;\n    try {\n        for (const key of [MACHINE_SAVE_V6_KEY, MACHINE_SAVE_V5_KEY, MACHINE_SAVE_V4_KEY, MACHINE_SAVE_V3_KEY, MACHINE_SAVE_KEY])\n            storage.removeItem(key);\n        return true;\n    } catch {\n        return false;\n    }\n}\n"""
              p.write_text(text)

          # scene.js: render exactly the expanded DEFAULT_WORLD used by locomotion and navigation.
          replace('scene.js',
              "import { DEFAULT_WORLD, physicsYawToViewYaw } from './locomotion.js';",
              "import { DEFAULT_WORLD, HOSTILE_SPAWN, PLAYER_SPAWN, physicsYawToViewYaw } from './locomotion.js';")
          replace('scene.js',
              "scene.fog = new THREE.FogExp2(0x171915, 0.018);\n    const camera = new THREE.PerspectiveCamera(68, 1, 0.06, 95);",
              "scene.fog = new THREE.FogExp2(0x171915, 0.0125);\n    const camera = new THREE.PerspectiveCamera(68, 1, 0.06, 125);")
          replace('scene.js',
              "targetExterior.root.position.set(0, 0, 0);",
              "targetExterior.root.position.set(HOSTILE_SPAWN.x, 0, HOSTILE_SPAWN.z);")
          replace('scene.js',
              "ring.position.set(0, .035, 0);\n    scene.add(ring);",
              "ring.position.set(HOSTILE_SPAWN.x, .035, HOSTILE_SPAWN.z);\n    scene.add(ring);\n    const pilotRing = new THREE.Mesh(new THREE.RingGeometry(1.75, 1.84, 32), new THREE.MeshBasicMaterial({ color: C.green, side: THREE.DoubleSide, transparent: true, opacity: .26 }));\n    pilotRing.rotation.x = -Math.PI / 2;\n    pilotRing.position.set(PLAYER_SPAWN.x, .034, PLAYER_SPAWN.z);\n    scene.add(pilotRing);")
          s = Path('scene.js')
          text = s.read_text()
          text = text.replace('raycaster.far = 70;', 'raycaster.far = 100;')
          text = text.replace('addScaledVector(sightDir, 70)', 'addScaledVector(sightDir, 100)')
          text = text.replace('addScaledVector(bore, 70)', 'addScaledVector(bore, 100)')
          start = text.index('function buildWarehouse(scene) {')
          end = text.index('function buildCockpit(scene) {')
          warehouse = r'''function buildWarehouse(scene) {
    const solids = [];
    const width = DEFAULT_WORLD.maxX - DEFAULT_WORLD.minX;
    const depth = DEFAULT_WORLD.maxZ - DEFAULT_WORLD.minZ;
    const floor = box(width + 3, 0.35, depth + 3, mat(C.concreteDark, 1, 0));
    floor.position.set((DEFAULT_WORLD.minX + DEFAULT_WORLD.maxX) / 2, -0.18, (DEFAULT_WORLD.minZ + DEFAULT_WORLD.maxZ) / 2);
    scene.add(floor);
    solids.push(floor);
    const gridSize = Math.max(width, depth);
    const grid = new THREE.GridHelper(gridSize, Math.max(16, Math.round(gridSize / 2)), 0x4d4a3e, 0x34342f);
    grid.position.y = 0.01;
    scene.add(grid);

    const wallMat = mat(C.concrete, 0.98, 0.02);
    const wallThickness = 0.6;
    const wallHeight = 8;
    const wallOffset = 1.0;
    const centerX = (DEFAULT_WORLD.minX + DEFAULT_WORLD.maxX) / 2;
    const centerZ = (DEFAULT_WORLD.minZ + DEFAULT_WORLD.maxZ) / 2;
    const north = box(width + 2, wallHeight, wallThickness, wallMat);
    north.position.set(centerX, wallHeight / 2, DEFAULT_WORLD.minZ - wallOffset);
    scene.add(north);
    solids.push(north);
    const south = box(width + 2, wallHeight, wallThickness, wallMat);
    south.position.set(centerX, wallHeight / 2, DEFAULT_WORLD.maxZ + wallOffset);
    scene.add(south);
    solids.push(south);
    const west = box(wallThickness, wallHeight, depth + 2, wallMat);
    west.position.set(DEFAULT_WORLD.minX - wallOffset, wallHeight / 2, centerZ);
    scene.add(west);
    solids.push(west);
    const east = box(wallThickness, wallHeight, depth + 2, wallMat);
    east.position.set(DEFAULT_WORLD.maxX + wallOffset, wallHeight / 2, centerZ);
    scene.add(east);
    solids.push(east);

    const stripeMat = mat(C.yellow, 0.9, 0.08);
    for (const z of [PLAYER_SPAWN.z + 2.6, HOSTILE_SPAWN.z - 2.6]) {
        for (let x = DEFAULT_WORLD.minX + 4; x <= DEFAULT_WORLD.maxX - 4; x += 8) {
            const stripe = box(3.5, 0.03, 0.22, stripeMat);
            stripe.position.set(x, 0.03, z);
            scene.add(stripe);
        }
    }

    const obstacleMaterial = obstacle => {
        if (obstacle.kind === 'pillar') return mat(C.metal, .70, .65);
        if (obstacle.kind === 'container') return mat(obstacle.id.endsWith('east') ? C.teal : C.rust, .82, .20);
        if (obstacle.kind === 'building') return mat(0x565750, .96, .05);
        return mat(C.concreteDark, .98, .02);
    };
    for (const obstacle of DEFAULT_WORLD.obstacles) {
        const w = obstacle.maxX - obstacle.minX;
        const d = obstacle.maxZ - obstacle.minZ;
        const h = Number.isFinite(obstacle.height) ? obstacle.height : 1.1;
        const object = box(w, h, d, obstacleMaterial(obstacle));
        object.position.set((obstacle.minX + obstacle.maxX) / 2, h / 2, (obstacle.minZ + obstacle.maxZ) / 2);
        object.userData.arenaObstacleId = obstacle.id;
        scene.add(object);
        solids.push(object);
        if (obstacle.kind === 'barrier' || obstacle.kind === 'barrier-low' || obstacle.kind === 'building') {
            const cap = box(w * .88, .08, d * 1.02, stripeMat);
            cap.position.set(object.position.x, h + .04, object.position.z);
            scene.add(cap);
        }
        if (obstacle.kind === 'container') {
            for (const side of [-1, 1]) {
                const rib = box(.08, h * .86, d * .92, mat(0x303734, .84, .32));
                rib.position.set(object.position.x + side * (w / 2 - .10), h * .5, object.position.z);
                scene.add(rib);
            }
        }
    }

    const lightMaterial = new THREE.MeshStandardMaterial({ color: 0xffcf8a, emissive: 0xffa43a, emissiveIntensity: 2.4 });
    for (const z of [-14, 14]) {
        for (const x of [-22, 0, 22]) {
            const fixture = box(3.6, 0.12, 0.28, lightMaterial);
            fixture.position.set(x, 7.2, z);
            scene.add(fixture);
            const light = new THREE.PointLight(0xffb65f, 15, 20, 1.8);
            light.position.set(x, 6.8, z);
            scene.add(light);
        }
    }

    const signCanvas = document.createElement('canvas');
    signCanvas.width = 384;
    signCanvas.height = 64;
    const ctx = signCanvas.getContext('2d');
    if (ctx) {
        ctx.fillStyle = '#161a18';
        ctx.fillRect(0, 0, signCanvas.width, signCanvas.height);
        ctx.fillStyle = '#d6a64a';
        ctx.font = 'bold 23px monospace';
        ctx.fillText('SCRAPYARD BEGINNER YARD', 20, 39);
    }
    const texture = new THREE.CanvasTexture(signCanvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 1.4), new THREE.MeshBasicMaterial({ map: texture }));
    sign.position.set(centerX, 5, DEFAULT_WORLD.minZ - .67);
    scene.add(sign);
    return solids;
}
'''
          text = text[:start] + warehouse + text[end:]
          s.write_text(text)

          # sceneAssembly cache-busts the direct base renderer import.
          replace('sceneAssembly.js', "./scene.js?source=k3b1", "./scene.js?source=k3i0")

          # index: dev wipe control and cache/version refresh.
          replace('index.html', '"./persistence.js": "./persistence.js?v=k3h0"', '"./persistence.js": "./persistence.js?v=k3i0"')
          replace('index.html', '"./locomotion.js": "./locomotion.js?v=k3c0"', '"./locomotion.js": "./locomotion.js?v=k3i0"')
          replace('index.html', '"./scene.js": "./sceneAssembly.js?v=k3b1"', '"./scene.js": "./sceneAssembly.js?v=k3i0"')
          replace('index.html', '<title>MECH ARENA — 0.0.1k.3h.0 — Scrapyard Circuit</title>', '<title>MECH ARENA — 0.0.1k.3i.0 — Beginner Arena</title>')
          replace('index.html', '<header>RIG DIAGNOSTICS <span>0.0.1k.3h.0</span></header>', '<header>RIG DIAGNOSTICS <span>0.0.1k.3i.0</span></header>')
          replace('index.html',
              '<div class="dev-actions"><button id="reset-rig" type="button">RESET RIG</button><button id="toggle-colliders" type="button">COLLIDERS: OFF</button></div>',
              '<div class="dev-actions"><button id="reset-rig" type="button">RESET RIG</button><button id="toggle-colliders" type="button">COLLIDERS: OFF</button><button id="wipe-save" type="button" aria-pressed="false">WIPE SAVE / START FRESH</button></div>')
          replace('index.html', '<script type="module" src="./main.js?v=k3g0"></script>', '<script type="module" src="./main.js?v=k3i0"></script>')

          print('Applied k.3i.0 arena integration')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git add main.js persistence.js scene.js sceneAssembly.js index.html
          git commit -m "k.3i.0 integrate beginner arena pacing and dev save wipe"
          git push origin HEAD:feature/k3i0-beginner-arena
