name: Final verify combat depth

on:
  push:
    branches:
      - feature/k3n1-o1-combat-depth

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3n1-o1-combat-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check changed JavaScript
        run: |
          node --check main.js
          node --check enemyMotion.js
          node --check combat.js
          node --check scene.js
          node --check contracts.js
          node --check contractUI.js
          node --check squadCoordination.js
          node --check sortieObjectives.js
          node --check damageBehavior.js
      - name: Run complete test suite
        run: npm test
      - name: Validate branch diff
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Remove temporary verifier
        run: rm -f .github/workflows/k3n1-o1-final-verify.yml
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary combat-depth verifier'
          git push origin HEAD:feature/k3n1-o1-combat-depth
