name: Verify k.3k.2 impact shake followup

on:
  push:
    branches:
      - feature/k3k2-cockpit-embodiment-sortie-flow

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3k2-cockpit-embodiment-sortie-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/k3k2_followup.py
      - run: node --check scene.js && npm test
      - name: Commit followup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scene.js
          git commit -m 'fix: consume cockpit impact shake profile'
          git push origin HEAD:feature/k3k2-cockpit-embodiment-sortie-flow
