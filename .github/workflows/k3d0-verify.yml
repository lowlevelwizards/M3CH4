name: Verify k.3d.0 recovery loop

on:
  push:
    branches: ["feature/k3d0-recovery-loop"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check changed runtime modules
        run: node --check main.js && node --check economy.js && node --check persistence.js && node --check garage.js
      - name: Run unit tests
        run: npm test
