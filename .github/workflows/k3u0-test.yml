name: k.3u.0 temporary regression
on:
  push:
    branches: ["k3u0-cockpit-clarity-state-truth"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full tests
        run: npm test
      - name: Syntax checks
        run: node --check main.js && node --check scene.js && node --check unifiedGarageUI.js && node --check tests/k3u0CockpitTruth.test.mjs
      - name: Whitespace
        run: git diff --check b0569641792a449c608dde883409374c4d76f955..HEAD
