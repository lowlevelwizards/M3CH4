name: k3v4 Generator Power Dynamics CI
on:
  push:
    branches: ["k3v4-generator-power-dynamics"]
  pull_request:
    paths:
      - "powerDynamics.js"
      - "main.js"
      - "scene.js"
      - "index.html"
      - "sceneAssembly.js"
      - "research/powerResponseStudy.mjs"
      - "tests/**"
      - ".github/workflows/k3v4-ci.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax of changed JavaScript
        run: |
          for f in main.js scene.js sceneAssembly.js powerDynamics.js research/powerResponseStudy.mjs tests/k3v4PowerDynamics.test.mjs; do node --check "$f"; done
      - name: Full test suite
        run: npm test
      - name: Reproducible source of truth studies
        run: |
          mkdir -p study-results
          node research/powerResponseStudy.mjs | tee study-results/power-response.md
          node research/powerResponseStudy.mjs --json > study-results/power-response.json
          node research/partIdentityBaseline.mjs > study-results/part-identity.md
          node research/mobilityTemperamentStudy.mjs > study-results/mobility.md
      - name: Headless 3v3 Domination compatibility
        run: node research/headlessDominationStudy.mjs 2
      - name: Preserve studies
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3v4-generator-power-studies
          path: study-results/
          if-no-files-found: warn
