name: Verify k.3p.0 disabled versus destroyed
on:
  push:
    branches: [feature/k3p0-recoverable-weapon-disable]
    paths:
      - tools/k3p0_disabled_vs_destroyed.py
      - .github/workflows/k3p0-fate-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3p0-recoverable-weapon-disable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fate refinement
        run: python3 tools/k3p0_disabled_vs_destroyed.py
      - name: Syntax check touched JavaScript
        run: |
          node --check main.js
          node --check fieldService.js
          node --check aiFieldService.js
      - name: Run complete test suite
        run: npm test
      - name: Validate branch diff
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          git diff --check
      - name: Remove temporary verifier
        run: rm -f tools/k3p0_disabled_vs_destroyed.py .github/workflows/k3p0-fate-verify.yml
      - name: Commit verified refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine disabled versus destroyed weapon recovery'
          git push origin HEAD:feature/k3p0-recoverable-weapon-disable
