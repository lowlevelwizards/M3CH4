name: Early Circuit Physical Map Validation
on:
  pull_request:
    paths:
      - 'maps/**'
      - 'main.js'
      - 'scene.js'
      - 'backlotDerbyWorld.js'
      - 'research/circuitMapsBrowserSmoke.mjs'
      - 'sceneAssembly.js'
      - 'contracts.js'
      - 'research/headlessDominationStudy.mjs'
      - 'research/circuitMapBalanceStudy.mjs'
      - 'research/circuitMapCandidateStudy.mjs'
      - 'research/circuitMapContractStudy.mjs'
      - 'tests/circuitMapRegistry.test.mjs'
      - 'tests/circuitMapFlow.test.mjs'
      - '.github/workflows/circuit-maps-ci.yml'
  workflow_dispatch:
jobs:
  circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify physical map geometry and contract-world parity
        run: node --test tests/circuitMapRegistry.test.mjs tests/circuitMapFlow.test.mjs
      - name: Run genuine three-map headless AI physical battle cohort
        run: node research/circuitMapBalanceStudy.mjs 8
      - name: Compare live and proposed objective layouts (8 matched side-swapped seeds)
        run: node research/circuitMapCandidateStudy.mjs 8
      - name: Run each actual campaign contract mode on its selected map
        run: node research/circuitMapContractStudy.mjs 4
      - name: Retain map-specific first-contact and route metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-circuit-map-balance
          path: |
            study-results/circuit-map-baseline.json
            study-results/map-candidate-study.json
            study-results/circuit-contract-cohort.json
          if-no-files-found: warn
