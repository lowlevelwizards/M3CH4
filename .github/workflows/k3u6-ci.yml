name: k3u6 Objective Discipline CI
on:
  push:
    branches: ["k3u6-objective-discipline"]
    paths: [".github/workflows/k3u6-ci.yml"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax and whitespace
        run: |
          node --check main.js
          for f in ai/*.js; do node --check "$f"; done
          node --check tests/k3u6ObjectiveDiscipline.test.mjs
          git diff --check HEAD^ HEAD
      - name: Full regression after flexible pre-majority capture and contested movement tuning
        run: npm test
      - name: 60 Hz Domination physics smoke
        run: node research/headlessDominationStudy.mjs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3u6-physics-smoke
          path: study-results/
          if-no-files-found: warn
