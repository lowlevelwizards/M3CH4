name: Verify k.3n.1 through k.3o.1 combat depth

on:
  push:
    branches:
      - feature/k3n1-o1-combat-depth

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3n1-o1-combat-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped integration
        run: python tools/k3n1_o1_apply.py
      - name: Syntax check touched JavaScript
        run: |
          node --check main.js
          node --check enemyMotion.js
          node --check combat.js
          node --check scene.js
          node --check contracts.js
          node --check contractUI.js
          node --check squadCoordination.js
          node --check sortieObjectives.js
          node --check damageBehavior.js
      - name: Run complete test suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary verification machinery
        run: rm -f tools/k3n1_o1_apply.py .github/workflows/k3n1-o1-verify.yml
      - name: Commit verified product state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'k.3n.1-k.3o.1: integrate coordinated objective combat depth'
          git push origin HEAD:feature/k3n1-o1-combat-depth
