name: Apply and verify k.3k.4 combiner cover truth
on:
  push:
    branches:
      - feature/k3k4-combiner-cover-truth
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3k4-combiner-cover-truth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply k.3k.4 product patch
        run: python .github/k3k4_apply.py
      - name: Syntax check touched JavaScript
        run: |
          node --check main.js
          node --check scene.js
          node --check sceneAssembly.js
          node --check cockpitView.js
          node --check coverTruth.js
      - name: Run full test suite
        run: npm test
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html main.js scene.js sceneAssembly.js
          git commit -m 'feat: k.3k.4 combiner anchoring and cover truth'
          git push
