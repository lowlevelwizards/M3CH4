name: Verify k.3i.0 beginner arena

on:
  push:
    branches: ["feature/k3i0-beginner-arena"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check arena modules
        run: node --check locomotion.js && node --check main.js && node --check scene.js && node --check sceneAssembly.js && node --check persistence.js && node --check tests/arenaPacing.test.mjs
      - name: Run unit tests
        run: npm test
