name: Apply k.3k.0 safety follow-up

on:
  push:
    branches: ["feature/k3k0-first-3v3"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3k0-first-3v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safety fixes
        run: python .github/k3k0_followup.py
      - name: Commit product fixes
        run: |
          if git diff --quiet -- scene.js main.js; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js main.js
          git commit -m "fix: preserve actor identity and mission-kill controls"
          git push
