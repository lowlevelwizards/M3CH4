name: k.3u.2 temporary validation
on:
  push:
    branches: ["k3u2-tactical-breakthrough"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: All existing and tactical regressions
        run: npm test
      - name: Syntax
        run: |
          node --check main.js
          node --check sortieObjectives.js
          for f in ai/*.js; do node --check "$f"; done
      - name: Whitespace
        run: git diff --check 2dbb2d1dec1ca017a56ec04f1c6f323f82eed8b7..HEAD
