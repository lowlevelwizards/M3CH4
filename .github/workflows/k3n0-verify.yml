name: Verify k.3n.0 tiny campaign
on:
  push:
    branches: [feature/k3n0-tiny-campaign-loop]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3n0-tiny-campaign-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final integration patch
        run: python3 tools/k3n0_finalize.py
      - name: Syntax check touched JavaScript
        run: |
          node --check campaign.js
          node --check contracts.js
          node --check contractUI.js
          node --check squadBattle.js
          node --check persistence.js
          node --check garageMountUI.js
      - name: Run complete test suite
        run: npm test
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary verification machinery
        run: |
          rm -f tools/k3n0_finalize.py .github/workflows/k3n0-verify.yml
      - name: Commit verified product state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'k.3n.0: complete tiny scrapyard campaign loop'
          git push origin HEAD:feature/k3n0-tiny-campaign-loop
