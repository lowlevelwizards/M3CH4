name: Apply k.3j.0 emergency recovery integration

on:
  push:
    branches: ["feature/k3j0-emergency-recovery"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3j0-emergency-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped recovery patch
        run: |
          python .github/k3j0_apply.py
          python .github/k3j0_followup.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js index.html
          git commit -m "feat: integrate emergency weapon recovery"
          git push
