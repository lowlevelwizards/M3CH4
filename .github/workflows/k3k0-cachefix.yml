name: Apply k.3k.0 final cache refresh

on:
  push:
    branches: ["feature/k3k0-first-3v3"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3k0-first-3v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh 3v3 CSS and contact copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          text = text.replace('./styles.css?v=k3d0', './styles.css?v=k3k0')
          text = text.replace('LIVE-FIRE DUEL · HOSTILE RIG AHEAD', 'SQUAD CONTACT · HOSTILES AHEAD')
          p.write_text(text)
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: refresh squad HUD styles"
          git push
