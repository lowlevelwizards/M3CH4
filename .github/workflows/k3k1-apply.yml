name: Apply and verify k.3k.1 combat readability

on:
  push:
    branches: ["feature/k3k1-combat-readability-impact"]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k3k1-combat-readability-impact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply base readability patch if needed
        run: python .github/k3k1_apply.py
      - name: Apply final readability fixes
        run: python .github/k3k1_followup.py
      - name: Syntax check touched JS
        run: |
          node --check wreckPhysics.js
          node --check damageVisuals.js
          node --check scene.js
          node --check sceneAssembly.js
          node --check main.js
          node --check tests/wreckPhysics.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Commit final product changes
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "fix: finalize k.3k.1 wreck and mission feedback"
          git push origin HEAD:feature/k3k1-combat-readability-impact
