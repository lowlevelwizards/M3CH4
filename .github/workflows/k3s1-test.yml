name: k.3s.1 temporary validation
on:
  push:
    branches: ["k3s1-garage-interaction-readability"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Changed JS syntax
        run: node --check unifiedGarageUI.js && node --check scene.js && node --check sceneAssembly.js && node --check tests/k3s1GarageUX.test.mjs
      - name: Whitespace
        run: git diff --check da555fc0c36336bd81e5e345fd19a14bcac32620..HEAD
